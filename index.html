<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Till Stock</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Till Stock">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    color-scheme: light dark;
    --accent:#2563eb; --accent-deep:#1d4ed8;
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f0f1f4;
    --ink:#15181d; --muted:rgba(0,0,0,.55); --faint:rgba(0,0,0,.4);
    --line:rgba(0,0,0,.09); --line-strong:rgba(0,0,0,.14);
    --good:#1a8a4c; --good-bg:#e7f5ec; --danger:#d0342c; --danger-bg:#fdecea;
    --warn:#b45309; --warn-bg:#fdf1e3;
    --cost-bg:#eef1f5; --cost-ink:#41506a;
    --shadow:0 1px 3px rgba(0,0,0,.06);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --surface:#191c22; --surface-2:#22262e;
      --ink:#f2f4f7; --muted:rgba(255,255,255,.6); --faint:rgba(255,255,255,.42);
      --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.16);
      --accent:#3b82f6; --accent-deep:#2563eb;
      --good:#4ade80; --good-bg:rgba(74,222,128,.15); --danger:#f87171; --danger-bg:rgba(248,113,113,.16);
      --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14);
      --cost-bg:rgba(255,255,255,.07); --cost-ink:#aeb8c8;
      --shadow:0 1px 3px rgba(0,0,0,.3);
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:var(--font); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
  }
  button{ font-family:inherit; cursor:pointer; }
  input{ font-family:inherit; }

  /* ---------- Login ---------- */
  .login{ min-height:100%; display:flex; flex-direction:column; justify-content:center;
    padding:calc(24px + var(--safe-top)) 22px calc(24px + var(--safe-bottom)); gap:18px; max-width:440px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:46px; height:46px; border-radius:13px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; }
  .brand h1{ font-size:20px; margin:0; font-weight:700; letter-spacing:-.2px; }
  .brand p{ margin:2px 0 0; font-size:13px; color:var(--muted); }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  .login form{ padding:20px; display:flex; flex-direction:column; gap:14px; }
  label{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  input[type=email],input[type=password]{
    width:100%; padding:13px 14px; font-size:16px; border:1px solid var(--line-strong);
    border-radius:11px; background:var(--surface-2); color:var(--ink);
  }
  input:focus{ outline:2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset:1px; border-color:var(--accent); }
  .remember{ display:flex; align-items:center; gap:9px; font-size:14px; color:var(--muted); text-transform:none; letter-spacing:0; font-weight:500; }
  .remember input{ width:18px; height:18px; accent-color:var(--accent); }
  .btn{ width:100%; padding:14px; font-size:16px; font-weight:700; border:none; border-radius:12px;
    background:var(--accent); color:#fff; }
  .btn:active{ background:var(--accent-deep); }
  .btn:disabled{ opacity:.6; }
  .msg{ font-size:13.5px; padding:10px 12px; border-radius:10px; display:none; }
  .msg.err{ display:block; background:var(--danger-bg); color:var(--danger); }
  .hint{ font-size:12.5px; color:var(--faint); text-align:center; line-height:1.5; }

  /* ---------- App ---------- */
  .app{ display:none; flex-direction:column; height:100%; }
  .topbar{ position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--line);
    padding:calc(10px + var(--safe-top)) 14px 10px; }
  .toprow{ display:flex; align-items:center; gap:10px; }
  .toprow .title{ font-size:17px; font-weight:700; letter-spacing:-.2px; }
  .toprow .spacer{ flex:1; }
  .iconbtn{ width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .iconbtn:active{ background:var(--line); }
  .iconbtn svg{ width:19px; height:19px; }
  /* Count reads as an action, not another utility, so it carries the accent.
     Named .tally, not .count — .count is already the green in-stock badge on a
     row, and it would repaint this button green and break its layout. */
  .iconbtn.tally{ border-color:color-mix(in srgb, var(--accent) 45%, transparent);
    background:color-mix(in srgb, var(--accent) 10%, var(--surface)); color:var(--accent); }
  /* A refresh that returns identical data looks like nothing happened. One full
     turn on press is the receipt that the tap registered. */
  @keyframes spinOnce{ to{ transform:rotate(360deg); } }
  #refreshBtn.spinning svg{ animation:spinOnce .6s cubic-bezier(.34,.9,.3,1); }
  @media (prefers-reduced-motion: reduce){ #refreshBtn.spinning svg{ animation:none; } }
  .search{ position:relative; margin-top:10px; }
  .search svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--faint); }
  .search input{ width:100%; padding:12px 48px 12px 38px; font-size:16px; border:1px solid var(--line-strong);
    border-radius:11px; background:var(--surface-2); color:var(--ink); }
  /* type="search" adds a NATIVE grey × on WebKit/Chromium that overlaps our own
     clear button — two ×'s fighting for the same tap is why it felt finicky.
     Remove the native one so only our button is there. */
  .search input::-webkit-search-cancel-button,
  .search input::-webkit-search-decoration{ -webkit-appearance:none; appearance:none; }
  /* Full-height, glyph-centred tap target sitting ON TOP of the input's right
     padding. The old 30px box held a top-aligned × and was an ambiguous target
     right next to the input — on a phone iOS often caught the input instead, so
     you had to jab dead-centre. z-index keeps it above the input; flex centres
     the × so the visible mark IS the hit centre; :active is a visible tap. */
  .search .clr{ position:absolute; right:4px; top:50%; transform:translateY(-50%); width:42px; height:42px;
    display:none; align-items:center; justify-content:center; border:none; background:none;
    color:var(--faint); font-size:22px; line-height:1; padding:0; border-radius:10px; z-index:2; }
  .search.has .clr{ display:flex; }
  .search .clr:active{ background:var(--line); color:var(--muted); }
  .statusline{ display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:8px;
    font-size:12px; color:var(--faint); }
  .statusline .fresh{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--good); }

  /* ---------- Count stock ---------- */
  /* .list is a flex column, so its children shrink to fit rather than letting it
     scroll. The rack strip (overflow-x:auto) collapses to nothing without this. */
  #countList > *, #reviewList > *{ flex:0 0 auto; }
  .prog{ background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 13px;
    margin-bottom:10px; box-shadow:var(--shadow); }
  .prog-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    font-size:12.5px; color:var(--muted); font-weight:600; }
  .prog-top b{ font-size:15px; color:var(--ink); }
  .bar{ height:6px; border-radius:999px; background:var(--surface-2); margin-top:8px; overflow:hidden; }
  .bar div{ height:100%; background:var(--accent); border-radius:999px; transition:width .18s; }

  .racks{ display:flex; gap:7px; overflow-x:auto; margin:0 -12px 10px; padding:0 12px 2px; scrollbar-width:none; }
  .racks::-webkit-scrollbar{ height:0; }
  .rack{ flex:0 0 auto; font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px; white-space:nowrap;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--muted);
    display:inline-flex; align-items:center; gap:6px; }
  .rack.on{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); color:var(--accent); }
  .rack .d{ width:6px; height:6px; border-radius:999px; background:var(--faint); }
  .rack.full .d{ background:var(--good); }
  .rack.on .d{ background:currentColor; }
  .rack .n{ opacity:.65; font-weight:600; }

  .grouphead{ display:flex; justify-content:space-between; font-size:11.5px; font-weight:800; color:var(--muted);
    text-transform:uppercase; letter-spacing:.6px; margin:14px 2px 7px; }
  .grouphead span{ text-transform:none; letter-spacing:0; font-weight:600; color:var(--faint); }

  .crow{ background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 13px; box-shadow:var(--shadow); }
  .crow.ok{ border-color:color-mix(in srgb, var(--good) 45%, transparent); }
  .crow.diff{ border-color:color-mix(in srgb, var(--warn) 55%, transparent);
    background:color-mix(in srgb, var(--warn) 5%, var(--surface)); }
  .crow-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  /* .name/.brandline are scoped to .row elsewhere, so a count card needs its own. */
  .crow .name{ font-size:15px; font-weight:700; letter-spacing:-.1px; line-height:1.25; }
  .crow .brandline{ margin-top:2px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .onfile{ font-size:11.5px; color:var(--faint); font-weight:700; white-space:nowrap; margin-top:5px; }
  .tag{ font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .tag.none{ color:var(--faint); background:var(--surface-2); }
  .tag.ok, .tag.up{ color:var(--good); background:var(--good-bg); }
  .tag.dn{ color:var(--danger); background:var(--danger-bg); }
  .stepper{ display:flex; align-items:center; gap:9px; margin-top:10px; }
  .step{ width:46px; height:46px; border-radius:13px; border:1px solid var(--line-strong); background:var(--surface-2);
    color:var(--ink); font-size:23px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .step:active{ background:color-mix(in srgb, var(--accent) 14%, var(--surface)); border-color:var(--accent); color:var(--accent); }
  .step.same{ width:auto; padding:0 14px; font-size:13px; font-weight:700; }
  .qty{ flex:1; min-width:0; height:46px; border-radius:13px; border:1px solid var(--line-strong);
    background:var(--surface-2); text-align:center; font-size:19px; font-weight:800; color:var(--ink); outline:none; }
  .qty.untouched{ color:var(--faint); }
  .qty:focus{ border-color:var(--accent); background:var(--surface); }

  /* Where the tire actually is. Appears only once a line is counted — that's the
     moment you're stood in front of it. A tire with nothing on file gets a
     dashed box, because most of the catalog has no location yet and this is the
     one pass that can fill them in. */
  .whererow{ margin-top:8px; }
  .where{ width:100%; height:38px; padding:0 12px; border-radius:11px; font-size:13.5px; font-weight:600;
    border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); outline:none; }
  .where::placeholder{ color:var(--faint); font-weight:600; }
  .where:focus{ border-color:var(--accent); background:var(--surface); }
  .whererow.missing .where{ border-style:dashed; }

  .sendbox{ margin-top:14px; display:flex; flex-direction:column; gap:9px; }
  .slab{ font-size:11.5px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .cname{ width:100%; height:46px; padding:0 13px; border-radius:12px; font-size:15px; font-weight:700;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); outline:none; }
  .cname:focus{ border-color:var(--accent); }
  .serr{ font-size:13px; font-weight:600; padding:10px 12px; border-radius:10px;
    background:var(--danger-bg); color:var(--danger); line-height:1.45; }
  .btn.ghost{ background:var(--surface); color:var(--ink); border:1px solid var(--line-strong); }
  .sent{ margin-top:14px; display:flex; flex-direction:column; gap:8px; text-align:center;
    padding:22px 16px; border-radius:14px; background:var(--good-bg);
    border:1px solid color-mix(in srgb, var(--good) 40%, transparent); }
  .sent b{ font-size:17px; color:var(--good); }
  .sent span{ font-size:13px; color:var(--muted); line-height:1.55; }
  .sent .btn{ margin-top:6px; }

  .foot{ position:sticky; bottom:0; padding:12px 0 calc(8px + var(--safe-bottom));
    background:linear-gradient(to top, var(--bg) 72%, transparent); }
  .summary{ border-radius:14px; padding:14px 15px; background:var(--ink); color:#fff; }
  .summary .l{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; opacity:.6; }
  .summary .v{ font-size:26px; font-weight:800; letter-spacing:-.6px; margin-top:2px; }
  .summary .split{ display:flex; gap:22px; margin-top:11px; padding-top:11px; border-top:1px solid rgba(255,255,255,.15); }
  .summary .split .n{ font-size:15px; font-weight:800; margin-top:2px; }
  .arrowline{ display:flex; align-items:center; gap:9px; margin-top:7px; font-size:15px; font-weight:800; }
  .arrowline .was{ color:var(--faint); text-decoration:line-through; font-weight:700; }
  .arrowline .arr{ color:var(--faint); font-weight:400; }
  .note{ font-size:11.5px; color:var(--muted); line-height:1.5; margin:4px 2px 0; }

  .list{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:10px 12px calc(24px + var(--safe-bottom)); display:flex; flex-direction:column; gap:8px; }
  .row{ background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:12px 13px;
    display:flex; gap:12px; align-items:flex-start; box-shadow:var(--shadow); }
  .row .main{ min-width:0; flex:1; }
  .row .name{ font-size:15.5px; font-weight:700; letter-spacing:-.1px; line-height:1.25; }
  .row .brandline{ margin-top:2px; font-size:13px; font-weight:600; color:var(--muted); }
  .row .sub{ margin-top:5px; font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 10px; }
  .row .sub b{ color:var(--ink); font-weight:600; }
  .prices{ text-align:right; flex-shrink:0; }
  .sell{ font-size:16px; font-weight:800; letter-spacing:-.3px; }
  .cost{ margin-top:3px; font-size:11.5px; color:var(--cost-ink); background:var(--cost-bg);
    display:inline-block; padding:1px 7px; border-radius:6px; }
  .count{ margin-top:6px; font-size:12px; font-weight:700; color:var(--good); background:var(--good-bg);
    display:inline-block; padding:2px 8px; border-radius:20px; }
  .count.out{ color:var(--danger); background:var(--danger-bg); }
  .empty{ text-align:center; color:var(--faint); font-size:14px; padding:48px 20px; line-height:1.6; }
  .empty svg{ width:34px; height:34px; margin-bottom:10px; opacity:.5; }

  .banner{ background:color-mix(in srgb, var(--accent) 12%, var(--surface)); color:var(--accent);
    font-size:11.5px; font-weight:600; text-align:center; padding:5px; }
  .spin{ width:18px; height:18px; border:2px solid var(--line-strong); border-top-color:var(--accent);
    border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); font-size:14px; }
  @media (prefers-reduced-motion: reduce){ .spin{ animation:none; } }

  /* ---------- Sales log ---------- */
  #salesList > *{ flex:0 0 auto; }
  /* Day / Week / Month / All — the same grouping the desktop Sales log offers.
     Sits in the sticky header; scrolls sideways on a narrow phone if it must. */
  .segrow{ display:flex; gap:7px; margin-top:10px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .segrow::-webkit-scrollbar{ height:0; }
  .seg{ flex:0 0 auto; font-size:13px; font-weight:700; padding:8px 16px; border-radius:999px; white-space:nowrap;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--muted); }
  .seg.on{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); color:var(--accent); }

  .kpis{ display:flex; gap:8px; }
  .kpi{ flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:13px;
    padding:10px 12px; box-shadow:var(--shadow); }
  .kpi .l{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--faint); }
  .kpi .v{ font-size:18px; font-weight:800; letter-spacing:-.4px; margin-top:3px; white-space:nowrap; }
  .kpi .v.pos{ color:var(--good); }
  .kpi .v.neg{ color:var(--danger); }

  .srow{ background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 13px; box-shadow:var(--shadow); }
  .srow .top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .srow .name{ font-size:15px; font-weight:700; letter-spacing:-.1px; line-height:1.25; }
  .srow .brandline{ margin-top:2px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .srow .sell{ font-size:16px; font-weight:800; letter-spacing:-.3px; }
  .tag.new{ color:var(--accent); background:color-mix(in srgb, var(--accent) 13%, var(--surface)); }
  .tag.used{ color:var(--warn); background:var(--warn-bg); }
  .srow .ftr{ display:flex; align-items:center; gap:6px 12px; flex-wrap:wrap; margin-top:9px; font-size:12px; color:var(--muted); }
  .srow .ftr .cost{ margin-top:0; }
  .srow .work{ margin-left:auto; font-weight:800; color:var(--good); }
  .srow .work.neg{ color:var(--danger); }

  /* True-profit slider — sits next to the title. Off shows the recorded profit
     (COGS rounded up); on shows profit against exact, unrounded cost. */
  .tptoggle{ display:inline-flex; align-items:center; gap:8px; border:none; background:none; padding:6px 2px; margin:0;
    color:var(--muted); font-size:12px; font-weight:700; white-space:nowrap; }
  .tpswitch{ width:40px; height:23px; border-radius:999px; background:var(--line-strong); position:relative; transition:background .16s; flex:0 0 auto; }
  .tpknob{ position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .16s; }
  .tptoggle.on{ color:var(--accent); }
  .tptoggle.on .tpswitch{ background:var(--accent); }
  .tptoggle.on .tpknob{ transform:translateX(17px); }

  /* ---------- the count session ---------- */
  .startcount{ display:block; width:100%; min-height:58px; margin:0 0 12px; border:none; border-radius:12px;
    background:var(--ink); color:var(--bg); font-family:inherit; font-size:16px; font-weight:800; cursor:pointer; }
  .grouphead{ align-items:center; }
  .sessbar{ display:flex; align-items:center; gap:12px; margin:0 0 12px; padding:13px 16px; border-radius:12px;
    background:var(--accent); color:#fff; }
  .sessbar .dot{ width:9px; height:9px; border-radius:50%; background:#fff; opacity:.9; flex:0 0 9px; }
  .sessbar b{ display:block; font-size:15px; font-weight:800; }
  .sessbar span:not(.dot){ display:block; font-size:12px; opacity:.85; margin-top:1px; }
  .reqbanner{ margin:0 0 10px; padding:13px 16px; border-radius:12px; border:1px dashed var(--accent);
    background:rgba(37,99,235,.07); }
  .reqbanner b{ display:block; font-size:14.5px; color:var(--accent); }
  .reqbanner span{ display:block; font-size:12.5px; color:var(--muted); margin-top:2px; }
  .empty b{ display:block; color:var(--ink); font-size:16px; margin-bottom:6px; }
  /* rack home — one card per requested location, tap to open it */
  .rackcards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
  .rcard{ display:flex; flex-direction:column; gap:5px; text-align:left; font-family:inherit; cursor:pointer;
    min-height:116px; padding:14px 16px; border-radius:12px; background:var(--surface);
    border:1px solid var(--line); border-left:5px solid var(--accent); }
  .rcard.done{ border-left-color:var(--good); }
  .rc-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .rc-l{ font-size:19px; font-weight:800; color:var(--accent); }
  .rc-p{ font-size:13px; font-weight:700; color:var(--accent); }
  .rcard.done .rc-l, .rcard.done .rc-p{ color:var(--good); }
  .rc-s{ font-size:10px; font-weight:800; letter-spacing:.09em; color:var(--accent); }
  .rcard.done .rc-s{ color:var(--good); }
  .rc-m{ font-size:13px; color:var(--muted); margin-top:auto; }
  /* inside a rack */
  .rackhead{ display:flex; align-items:center; gap:12px; margin:0 0 10px; }
  .rhback{ width:42px; height:42px; flex:0 0 42px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:20px; line-height:1; cursor:pointer; font-family:inherit; }
  .rh-t{ font-size:19px; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rdone{ margin-left:auto; min-height:34px; padding:0 12px; border-radius:9px; cursor:pointer; font-family:inherit;
    font-size:12px; font-weight:700; background:transparent; border:1px solid var(--good); color:var(--good); }
  .rdone.on{ background:var(--good); border-color:var(--good); color:#fff; }
  /* Phone is stock + sales lookups for now — counting is the tablet's job, so the
     entry point simply isn't offered on a small screen. One rule to undo. */
  @media (max-width: 699px){ #countBtn{ display:none; } }

  /* ---------- tablet ----------
     Counting is the screen that actually changes shape. On a tablet you're
     walking the racks with both hands, so tires go two-up and the rack strip and
     progress bar stay full width above them — more of a rack visible per glance,
     which is the whole reason to carry the bigger device.
     Everything else simply stops stretching: a lookup list 1000px wide is harder
     to read, not easier. Tap targets grow rather than shrink. */
  /* 700px, not 820: an iPad in PORTRAIT is 744-820px wide depending on the model
     (mini 744, 10.2" 810, Air 820), so a higher breakpoint leaves most tablets
     held upright looking exactly like a phone. Columns come from auto-fill
     rather than a fixed 2, so portrait gets two and landscape gets three
     without a second breakpoint guessing at model widths. */
  @media (min-width: 700px){
    .app{ max-width:1180px; margin:0 auto; width:100%; }
    .list{ padding-left:20px; padding-right:20px; }
    .racks{ margin-left:-20px; margin-right:-20px; padding-left:20px; padding-right:20px; }

    #countList, #list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(310px, 1fr));
      gap:10px; align-content:start; }
    #countList > .prog,
    #countList > .racks,
    #countList > .grouphead,
    #countList > .foot,
    #countList > .empty,
    /* The session bar, the request, the rack home and a rack's own header all
       span the whole width — they're chrome for the page, not one of the tiles. */
    #countList > .startcount,
    #countList > .sessbar,
    #countList > .reqbanner,
    #countList > .rackcards,
    #countList > .rackhead,
    #list > .grouphead,
    #list > .empty,
    #list > .center{ grid-column:1 / -1; }

    .crow{ padding:13px 15px; }
    .step{ width:50px; height:50px; }
    .qty{ height:50px; font-size:20px; }
    .where{ height:42px; }
    .rack{ font-size:14px; padding:10px 16px; }

    /* Reading a variance is a column-of-numbers job — keep it narrow. */
    #reviewList, #salesList{ max-width:760px; margin:0 auto; width:100%; }
  }
</style>
</head>

<script>
(function(){
  // ---- Supabase (same project the Till desktop app syncs to) ----
  var SUPA_URL = 'https://ozztakbcnmlwoyiexlkt.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96enRha2Jjbm1sd295aWV4bGt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNzcyNzIsImV4cCI6MjA5ODc1MzI3Mn0.U0JvmpqFXQsBRRMqsffHO5oVSn79IFANvJJ84oUV7vI';
  var SESSION_KEY = 'till_stock_session';

  var $ = function(id){ return document.getElementById(id); };
  var session = null, products = [], updatedAt = null, query = '';
  var salesLog = [], salesGroupBy = 'day', salesQuery = '', salesTrueProfit = false;

  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){ session = null; }

  // ---------- auth ----------
  function saveSession(d, remember){
    session = {
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: Date.now() + ((d.expires_in || 3600) * 1000),
      email: (d.user && d.user.email) || (session && session.email) || '',
      remember: remember !== false
    };
    try { if (session.remember) localStorage.setItem(SESSION_KEY, JSON.stringify(session)); else localStorage.removeItem(SESSION_KEY); } catch(e){}
  }
  function clearSession(){ session = null; try { localStorage.removeItem(SESSION_KEY); } catch(e){} }

  function login(email, password){
    return fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{ 'apikey':ANON, 'Content-Type':'application/json' },
      body: JSON.stringify({ email: email, password: password })
    }).then(function(res){
      if (!res.ok) return res.json().catch(function(){return {};}).then(function(j){
        var m = j.error_description || j.msg || j.error || 'Sign-in failed';
        throw { message: m, credential: (res.status===400||res.status===401||res.status===422) };
      });
      return res.json();
    });
  }
  function refresh(){
    if (!session || !session.refresh_token) return Promise.resolve(false);
    return fetch(SUPA_URL + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{ 'apikey':ANON, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }).then(function(res){
      if (!res.ok){ clearSession(); return false; }
      return res.json().then(function(d){ saveSession(d, session && session.remember); return true; });
    }).catch(function(){ return false; });
  }
  function authedGet(path, retried){
    var headers = { 'apikey':ANON };
    if (session && session.access_token) headers['Authorization'] = 'Bearer ' + session.access_token;
    return fetch(SUPA_URL + path, { headers: headers }).then(function(res){
      if (res.status === 401 && !retried && session && session.refresh_token){
        return refresh().then(function(ok){ return ok ? authedGet(path, true) : res; });
      }
      return res;
    });
  }
  // The ONE write this device is allowed to make, and it doesn't go anywhere near
  // the shop data: it posts a finished count into the stock_counts mailbox, where
  // it waits for the shop computer to review it. Same token-refresh behaviour as
  // the read above.
  function authedPost(path, body, retried){
    var headers = { 'apikey':ANON, 'Content-Type':'application/json', 'Prefer':'return=minimal' };
    if (session && session.access_token) headers['Authorization'] = 'Bearer ' + session.access_token;
    return fetch(SUPA_URL + path, { method:'POST', headers: headers, body: JSON.stringify(body) })
      .then(function(res){
        if (res.status === 401 && !retried && session && session.refresh_token){
          return refresh().then(function(ok){ return ok ? authedPost(path, body, true) : res; });
        }
        return res;
      });
  }

  // ---------- data ----------
  function loadStock(){
    showLoading();
    // Pull ONLY the stock + sales-log sub-fields, never the whole shop blob — the
    // phone never receives invoices, customers, bills or cash totals, just the two
    // read-only lookups it shows (stock on hand, and what tires have sold).
    return authedGet('/rest/v1/shop_data?id=eq.1&select=updated_at,products:data->products,salesLog:data->salesLog')
      .then(function(res){
        if (res.status === 401){ clearSession(); showLogin('Your session expired — sign in again.'); return; }
        if (!res.ok) throw new Error('read failed');
        return res.json();
      })
      .then(function(rows){
        if (!rows) return;
        var row = rows[0] || {};
        updatedAt = row.updated_at;
        products = Array.isArray(row.products) ? row.products.slice() : [];
        products.sort(function(a,b){ return String(a.size||'').localeCompare(String(b.size||''), undefined, {numeric:true}); });
        salesLog = Array.isArray(row.salesLog) ? row.salesLog.slice() : [];
        showApp();
        renderList();
        renderFresh();
      })
      .catch(function(){
        $('list').innerHTML = '<div class="center">Couldn’t load stock. Check your connection and tap refresh.</div>';
        showApp();
      });
  }

  // ---------- rendering ----------
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function money(n){ var v = Number(n)||0; return '$' + v.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
  function matches(p, q){
    return (String(p.size||'')+' '+String(p.brand||'')+' '+String(p.type||'')+' '+String(p.location||'')+' '+String(p.ply||'')+' '+String(p.productCode||'')).toLowerCase().indexOf(q) !== -1;
  }
  function nameLines(p){
    var size = (p.size && String(p.size).trim()) ? String(p.size).trim() : '';
    var brand = (p.brand && String(p.brand).trim()) ? String(p.brand).trim() : '';
    if (size) return { title: size, brand: brand };   // brand sits on its own line below the size
    if (brand) return { title: brand, brand: '' };
    return { title: p.productCode || p.type || 'Item', brand: '' };
  }
  function renderList(){
    var q = query.trim().toLowerCase();
    var shown = q ? products.filter(function(p){ return matches(p, q); }) : products;
    if (!products.length){
      $('list').innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="M3 7l9 4.5L21 7M12 11.5V21"/></svg>No stock found yet.<br>Has your shop computer uploaded to the cloud?</div>';
      return;
    }
    if (!shown.length){ $('list').innerHTML = '<div class="empty">No matches for “' + esc(query.trim()) + '”</div>'; return; }
    var html = '';
    shown.forEach(function(p){
      var out = (Number(p.qty)||0) <= 0;
      var nm = nameLines(p);
      var subBits = [];
      if (p.ply) subBits.push('<b>' + esc(p.ply) + '</b> ply');
      if (p.location) subBits.push('📍 ' + esc(p.location));
      if (p.section) subBits.push(esc(p.section));
      if (p.productCode) subBits.push('#' + esc(p.productCode));
      html += '<div class="row">'
        + '<div class="main"><div class="name">' + esc(nm.title) + '</div>'
        + (nm.brand ? '<div class="brandline">' + esc(nm.brand) + '</div>' : '')
        + (subBits.length ? '<div class="sub">' + subBits.join('<span>·</span>') + '</div>' : '')
        + '</div>'
        + '<div class="prices"><div class="sell">' + money(p.sellPrice) + '</div>'
        + '<div class="cost">cost ' + money(p.buyPrice) + '</div>'
        + '<div class="count' + (out?' out':'') + '">' + (Number(p.qty)||0) + (out?' out':' in stock') + '</div>'
        + '</div></div>';
    });
    $('list').innerHTML = html;
  }
  function renderFresh(){
    if (!updatedAt){ $('freshText').textContent = ''; return; }
    var d = new Date(updatedAt), now = new Date();
    var mins = Math.round((now - d)/60000);
    var t;
    if (mins < 1) t = 'just now';
    else if (mins < 60) t = mins + ' min ago';
    else if (mins < 60*24 && d.toDateString()===now.toDateString()) t = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    else t = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    $('freshText').innerHTML = '<span class="dot"></span>updated ' + t;
  }

  // ---------- count stock ----------
  // A count is walked here and SENT to the shop computer, which is the only
  // thing that ever changes stock. This device still cannot touch inventory: it
  // posts the count into its own mailbox table (stock_counts) where it waits to
  // be reviewed. Nothing it sends takes effect on its own.
  //
  // Three things are remembered per tire, and the second one is the important one:
  //   counted[id]    what was physically found
  //   expectedAt[id] what Till said AT THE MOMENT it was counted
  //   foundAt[id]    where it was found, if the counter said
  // The computer applies (counted - expectedAt) to whatever the number is when
  // it's reviewed — so a tire that sells an hour after being counted doesn't
  // come back as a shortage. Sending only `counted` would make that impossible.
  var COUNT_KEY  = 'till_stock_count';
  var EXPECT_KEY = 'till_stock_count_expected';
  var FOUND_KEY  = 'till_stock_count_found';
  var NAME_KEY   = 'till_stock_count_name';
  // A count is a SESSION, not a pile of numbers. It is started deliberately, and
  // the only way out is submitting it — there is no stop button, because a count
  // half-abandoned on a shelf is worse than one that is still obviously open.
  var SESS_KEY = 'till_stock_count_session';
  // What the computer asked for. This device never decides what to count — the
  // shop picks the locations and sends them over, and this is that list. No
  // request means no count is needed, and the screen says exactly that rather
  // than offering 300 tires and leaving the counter to guess which matter.
  //   { at: ISO, note: string, racks: ['B1','C1'] }
  var REQ_KEY = 'till_stock_count_request';
  var request = null;
  try { request = JSON.parse(localStorage.getItem(REQ_KEY) || 'null'); } catch(e){ request = null; }
  function saveRequest(){
    try {
      if (request) localStorage.setItem(REQ_KEY, JSON.stringify(request));
      else localStorage.removeItem(REQ_KEY);
    } catch(e){}
  }
  // The hook the desktop sync will call once that side exists; also how a request
  // is put in place for testing. Passing null clears it.
  function setCountRequest(r){
    request = (r && r.racks && r.racks.length) ? r : null;
    saveRequest(); renderCount();
  }
  // Only the locations the computer named, and only ones we actually hold stock
  // for — a rack that has since been emptied isn't worth walking to.
  function requestedRacks(){
    if (!request || !request.racks) return [];
    var have = racks();
    return request.racks.filter(function(r){ return have.indexOf(r) !== -1; });
  }
  function requestOpen(){ return requestedRacks().length > 0; }
  // Everything the count is allowed to touch. Scoped to the request, so progress,
  // search and what gets sent back all agree on what "the count" is.
  function countables(){
    var want = requestedRacks();
    return products.filter(function(p){ return want.indexOf(rackOf(p)) !== -1; });
  }
  window.tsSetRequest = setCountRequest;
  var counted = {};      // { productId: number the owner keyed in }
  var expectedAt = {};   // { productId: on-file qty when it was counted }
  var foundAt = {};      // { productId: location typed while counting }
  var startedAt = null;  // ISO stamp — its presence IS "a count is open"
  var rackDone = {};     // { rackName: true } — marked complete by hand, independent of progress
  var countName = '';
  var rackFilter = 'All';
  var countQuery = '';
  var sending = false;

  try { counted = JSON.parse(localStorage.getItem(COUNT_KEY) || '{}') || {}; } catch(e){ counted = {}; }
  try { expectedAt = JSON.parse(localStorage.getItem(EXPECT_KEY) || '{}') || {}; } catch(e){ expectedAt = {}; }
  try { foundAt = JSON.parse(localStorage.getItem(FOUND_KEY) || '{}') || {}; } catch(e){ foundAt = {}; }
  try { countName = localStorage.getItem(NAME_KEY) || ''; } catch(e){ countName = ''; }
  // The memory. Counting a rack is interrupted constantly — a customer walks in,
  // the tablet sleeps, someone closes the tab. Every one of those has to be
  // survivable, so the session is read back off the device on load and the count
  // carries on exactly where it was left.
  try {
    var __s = JSON.parse(localStorage.getItem(SESS_KEY) || 'null');
    if (__s){ startedAt = __s.startedAt || null; rackDone = __s.rackDone || {}; }
  } catch(e){ startedAt = null; rackDone = {}; }
  // Counts written before sessions existed: adopt them rather than stranding the
  // numbers behind a Start button that would wipe them.
  if (!startedAt && Object.keys(counted).length) startedAt = new Date().toISOString();

  function saveCount(){
    try {
      localStorage.setItem(COUNT_KEY, JSON.stringify(counted));
      localStorage.setItem(EXPECT_KEY, JSON.stringify(expectedAt));
      localStorage.setItem(FOUND_KEY, JSON.stringify(foundAt));
      localStorage.setItem(NAME_KEY, countName);
      localStorage.setItem(SESS_KEY, JSON.stringify({ startedAt: startedAt, rackDone: rackDone }));
    } catch(e){}
  }
  function clearCount(){
    counted = {}; expectedAt = {}; foundAt = {}; countName = '';
    startedAt = null; rackDone = {};
    // The request is answered once the report goes back, so it goes with the
    // count. Leaving it would keep asking for a walk that has already been done.
    request = null; saveRequest();
    saveCount();
  }
  function countOpen(){ return !!startedAt; }
  // Starting is one-way. There is no matching stop: the button becomes a state
  // once pressed, and the session ends by being submitted.
  function startCount(){
    if (countOpen()) return;
    startedAt = new Date().toISOString();
    saveCount(); renderCount();
  }
  function toggleRackDone(r){
    if (rackDone[r]) delete rackDone[r]; else rackDone[r] = true;
    saveCount(); renderCount();
  }
  function startedText(){
    if (!startedAt) return '';
    var d = new Date(startedAt);
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' })
      + ' · ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  }
  window.tsStart = startCount; window.tsRackDone = toggleRackDone;
  // Pin what Till said the instant a tire is first counted. Only the FIRST entry
  // sets it — nudging the stepper afterwards must not move the baseline, or the
  // variance quietly rewrites itself as you correct a typo.
  function pinExpected(id, p){
    if (expectedAt[id] === undefined) expectedAt[id] = onFile(p);
  }

  function pid(p){ return String(p.id != null ? p.id : (p.productCode || p.size + '|' + p.brand)); }
  function isCounted(p){ return counted[pid(p)] !== undefined; }
  function onFile(p){ return Number(p.qty) || 0; }
  function diffOf(p){ return isCounted(p) ? counted[pid(p)] - onFile(p) : 0; }
  function countedProducts(){ return products.filter(isCounted); }
  function differences(){ return products.filter(function(p){ return isCounted(p) && diffOf(p) !== 0; }); }
  function rackOf(p){ return (p.location && String(p.location).trim()) || 'No rack'; }
  function racks(){
    var seen = [];
    products.forEach(function(p){ if (seen.indexOf(rackOf(p)) === -1) seen.push(rackOf(p)); });
    return seen.sort();
  }

  function bump(id, by){
    var p = products.filter(function(x){ return pid(x) === id; })[0];
    if (!p) return;
    var now = isCounted(p) ? counted[id] : onFile(p);   // first tap starts from what's on file
    pinExpected(id, p);
    counted[id] = Math.max(0, now + by);
    saveCount(); renderCount();
  }
  function typeQty(id, v){
    var p = products.filter(function(x){ return pid(x) === id; })[0];
    var s = String(v).trim();
    // Emptying the box un-counts the line — it goes back to "not counted yet",
    // which is a different thing from counting zero. The baseline goes with it.
    if (s === ''){ delete counted[id]; delete expectedAt[id]; }
    else {
      if (p) pinExpected(id, p);
      counted[id] = Math.max(0, Math.floor(Number(s) || 0));
    }
    saveCount(); renderCount(true);
  }
  function markSame(id){
    var p = products.filter(function(x){ return pid(x) === id; })[0];
    if (!p) return;
    pinExpected(id, p);
    counted[id] = onFile(p);
    saveCount(); renderCount();
  }
  // Where the tire actually is. Most of the catalog has no location on file, so
  // the first proper walk of the racks is also what fills them in — you're stood
  // in front of the tire, which is the only time anyone knows.
  // Deliberately does NOT re-render. A rack can hold hundreds of rows and the
  // list is rebuilt as one string, so re-rendering per keystroke turns typing a
  // location into a stutter. Nothing on screen depends on this value as you
  // type — it's read back from foundAt on the next real render.
  function setFound(id, v){
    var s = String(v == null ? '' : v).trim();
    if (s === '') delete foundAt[id]; else foundAt[id] = s;
    saveCount();
  }
  function setRack(r){ rackFilter = r; renderCount(); }
  function setCountName(v){ countName = String(v == null ? '' : v); saveCount(); }
  window.tsBump = bump; window.tsType = typeQty; window.tsSame = markSame;
  window.tsRack = setRack; window.tsFound = setFound; window.tsName = setCountName;

  function renderCount(keepFocus){
    var focusId = keepFocus && document.activeElement ? document.activeElement.id : null;
    var caret = focusId ? document.activeElement.selectionStart : null;

    // Racks are PAGES, not filters. Home lists the racks and nothing else;
    // tapping one opens just that rack's sizes. You count a rack at a time
    // standing in front of it, so one rack is all that should ever be on screen —
    // a single list of every size in the shop with headers down it was a list you
    // had to keep finding your place in.
    //
    // A search overrides both: when you're hunting one tire you don't know which
    // rack it's on, so it looks across all of them and each row says where it is.
    var cq = countQuery.trim().toLowerCase();
    var searching = cq !== '';
    var onHome = !searching && rackFilter === 'All';
    var pool = countables();          // the requested locations, and only those
    var scope = searching ? pool.filter(function(p){ return matches(p, cq); })
              : rackFilter === 'All' ? pool
              : pool.filter(function(p){ return rackOf(p) === rackFilter; });
    var scopeDone = scope.filter(isCounted).length;
    var scopeDiffs = scope.filter(function(p){ return isCounted(p) && diffOf(p) !== 0; }).length;

    // The session bar. Before a count is started it is the one thing to press;
    // afterwards it stops being a button at all and just says what is going on,
    // including when it was started — which is what tells you this is the count
    // you walked away from rather than a fresh one.
    //
    // (When the desktop's recount request lands it renders here too, and it must
    // NOT show once a count is open: the request is the reason you started, and
    // repeating it while you work is just noise. `request` stays null until the
    // desktop side exists.)
    var html = '';
    // Nothing asked for = nothing to do. Said plainly and finished with, rather
    // than dressed up as an error or left as a blank screen.
    if (!requestOpen()){
      $('countList').innerHTML =
        '<div class="empty"><b>No count needed</b>'
        + 'The computer hasn’t asked for one. When the shop sends a recount over, '
        + 'the locations it wants show up here.</div>';
      return;
    }
    if (!countOpen()){
      html += '<div class="reqbanner"><b>Recount requested · ' + esc(requestedRacks().join(', ')) + '</b>'
        + (request.note ? '<span>' + esc(request.note) + '</span>' : '') + '</div>';
      html += '<button class="startcount" onclick="tsStart()">Start count</button>';
    } else {
      // The request is why you started; repeating it while you work is noise.
      html += '<div class="sessbar"><span class="dot"></span><div><b>Count in progress</b>'
        + '<span>Started ' + esc(startedText()) + ' · submit it to finish</span></div></div>';
    }

    // Progress follows the rack you're standing at — finishing a rack should
    // read as finished, not as 6 of 312.
    html += '<div class="prog"><div class="prog-top">'
      + '<span><b>' + scopeDone + '</b> of ' + scope.length + ' counted'
      + (rackFilter === 'All' ? '' : ' in ' + esc(rackFilter)) + '</span>'
      + '<span>' + (scopeDiffs ? scopeDiffs + ' difference' + (scopeDiffs===1?'':'s')
                               : (scopeDone ? 'all matching' : '—')) + '</span>'
      + '</div><div class="bar"><div style="width:' + Math.round(scopeDone / Math.max(1, scope.length) * 100) + '%"></div></div></div>';

    if (onHome){
      // The rack home. One card per rack: how far through it you are, whether
      // you've called it done, and how much is meant to be on it.
      html += '<div class="rackcards">' + requestedRacks().map(function(r){
        var set = pool.filter(function(p){ return rackOf(p) === r; });
        var doneHere = set.filter(isCounted).length;
        var tires = set.reduce(function(s,p){ return s + onFile(p); }, 0);
        var isDone = !!rackDone[r];
        var word = isDone ? 'DONE' : doneHere ? 'IN PROGRESS' : 'NOT COUNTED';
        return '<button class="rcard' + (isDone ? ' done' : '') + '"'
          + ' onclick="tsRack(' + JSON.stringify(r).replace(/"/g,'&quot;') + ')">'
          + '<div class="rc-top"><span class="rc-l">' + esc(r) + '</span>'
          + '<span class="rc-p">' + doneHere + '/' + set.length + '</span></div>'
          + '<div class="rc-s">' + word + '</div>'
          + '<div class="rc-m">' + set.length + ' size' + (set.length === 1 ? '' : 's')
          + ' · ' + tires + ' tire' + (tires === 1 ? '' : 's') + '</div>'
          + '</button>';
      }).join('') + '</div>';
    } else {
      // Inside a rack (or looking at search results): a way back, and the one
      // rack's own "done" toggle sitting with its name rather than buried in a
      // header halfway down a list.
      var title = searching ? 'Matches for “' + esc(countQuery.trim()) + '”' : esc(rackFilter);
      var rdoneNow = !searching && !!rackDone[rackFilter];
      html += '<div class="rackhead">'
        + '<button class="rhback" onclick="tsRack(&quot;All&quot;)" aria-label="Back to racks">‹</button>'
        + '<div class="rh-t">' + title + '</div>'
        + (!searching && countOpen()
            ? '<button class="rdone' + (rdoneNow ? ' on' : '') + '"'
              + ' onclick="tsRackDone(' + JSON.stringify(rackFilter).replace(/"/g,'&quot;') + ')">'
              + (rdoneNow ? '✓ Rack done' : 'Mark rack done') + '</button>'
            : '')
        + '</div>';
    }

    var list = scope;

    // Group by rack BEFORE listing. The catalog is sorted by size for the lookup
    // screen, and counting inherited that order — which meant the rack changed on
    // almost every line and the list came out as header, tire, header, tire.
    // Counting is walked rack by rack, so the rack is what orders it, size within.
    // "No rack" sits at the end: it's the leftovers pile, not a place.
    list = list.slice().sort(function(a, b){
      var ra = rackOf(a), rb = rackOf(b);
      if (ra !== rb){
        if (ra === 'No rack') return 1;
        if (rb === 'No rack') return -1;
        return ra.localeCompare(rb, undefined, { numeric:true });
      }
      return String(a.size||'').localeCompare(String(b.size||''), undefined, { numeric:true });
    });

    if (onHome){
      /* the rack cards above are the whole page */
    } else if (!list.length){
      html += '<div class="empty">' + (searching ? 'No matches for “' + esc(countQuery.trim()) + '”' : 'Nothing on this rack.') + '</div>';
    } else {
      var lastRack = null;
      list.forEach(function(p){
        var r = rackOf(p);
        // Only search results need telling apart — inside a rack every row is on
        // the rack already named at the top of the page.
        if (searching && r !== lastRack){
          lastRack = r;
          var here = list.filter(function(x){ return rackOf(x) === r; });
          html += '<div class="grouphead">' + esc(r)
            + '<span>' + here.filter(isCounted).length + '/' + here.length + ' counted</span></div>';
        }
        var id = pid(p), on = isCounted(p), d = diffOf(p), nm = nameLines(p);
        var tag = !on ? '<span class="tag none">Not counted</span>'
          : d === 0 ? '<span class="tag ok">✓ Matches</span>'
          : '<span class="tag ' + (d > 0 ? 'up' : 'dn') + '">' + (d > 0 ? '+' : '') + d + '</span>';
        var js = JSON.stringify(id).replace(/"/g,'&quot;');
        html += '<div class="crow' + (on ? (d === 0 ? ' ok' : ' diff') : '') + '">'
          + '<div class="crow-top"><div style="min-width:0;">'
          + '<div class="name">' + esc(nm.title) + '</div>'
          + (nm.brand ? '<div class="brandline">' + esc(nm.brand) + '</div>' : '')
          + '</div><div style="text-align:right;">' + tag
          + '<div class="onfile">On file: ' + onFile(p) + '</div></div></div>'
          + '<div class="stepper">'
          + '<button class="step" onclick="tsBump(' + js + ',-1)" aria-label="One fewer">−</button>'
          + '<input class="qty' + (on ? '' : ' untouched') + '" id="q_' + esc(id) + '" inputmode="numeric" '
          + 'value="' + (on ? counted[id] : '') + '" placeholder="' + onFile(p) + '" '
          + 'oninput="tsType(' + js + ', this.value)" aria-label="Counted quantity">'
          + '<button class="step" onclick="tsBump(' + js + ',1)" aria-label="One more">+</button>'
          + (on ? '' : '<button class="step same" onclick="tsSame(' + js + ')">Same</button>')
          + '</div>'
          // The location box only appears once a line is counted — that's the
          // moment you're stood in front of the tire and actually know.
          + (on ? '<div class="whererow' + (p.location ? '' : ' missing') + '">'
              + '<input class="where" id="w_' + esc(id) + '" value="' + esc(foundAt[id] || '') + '" '
              + 'placeholder="' + (p.location ? esc(p.location) : 'Where is it?') + '" '
              + 'autocapitalize="characters" autocomplete="off" '
              + 'oninput="tsFound(' + js + ', this.value)" aria-label="Where you found this tire">'
              + '</div>' : '')
          + '</div>';
      });
    }

    // Submitting belongs on the rack home, not inside a rack: finishing one rack
    // isn't finishing the count, and a Submit button sitting under the last size
    // of rack B invites exactly that mistake.
    if (onHome){
      var diffs = differences().length, done = countedProducts().length;
      html += '<div class="foot"><button class="btn" id="toReviewBtn"' + (done ? '' : ' disabled') + '>'
        + (diffs ? 'See ' + diffs + ' difference' + (diffs===1?'':'s')
                 : (done && done === pool.length ? 'Everything matched' : 'See what\'s different'))
        + '</button></div>';
    }

    $('countList').innerHTML = html;
    var strip = $('rackStrip');
    var on = strip && strip.querySelector('.rack.on');
    if (on) strip.scrollLeft = on.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2;
    var go = $('toReviewBtn');
    if (go) go.addEventListener('click', function(){ if (countedProducts().length) showReview(); });

    if (focusId){
      var el = document.getElementById(focusId);
      if (el){ el.focus(); try { el.setSelectionRange(caret, caret); } catch(e){} }
    }
  }

  // Name, send button, and whatever state the send is in. Shown whether or not
  // anything differs — a rack counted and found correct is a real result, and
  // any locations stamped along the way still need to travel.
  function sendBlockHtml(){
    var n = countedProducts().length;
    if (countSent){
      return '<div class="sent"><b>Sent to the computer</b>'
        + '<span>' + n + ' counted. Open Till on the shop computer to review it. Nothing has changed yet.</span>'
        + '<button class="btn ghost" onclick="tsNewCount()">Start a new count</button></div>';
    }
    var stamps = countedProducts().filter(function(p){ return foundAt[pid(p)]; }).length;
    return '<div class="sendbox">'
      + '<label class="slab" for="cname">Name this count</label>'
      + '<input id="cname" class="cname" value="' + esc(countName) + '" placeholder="' + esc(defaultCountName()) + '" '
      + 'autocomplete="off" oninput="tsName(this.value)" aria-label="Name this count">'
      + (countError ? '<div class="serr">' + esc(countError) + '</div>' : '')
      + '<button class="btn" onclick="tsSend()"' + (sending ? ' disabled' : '') + '>'
      + (sending ? 'Sending…' : 'Send ' + n + ' counted tire' + (n === 1 ? '' : 's') + ' to the computer')
      + '</button>'
      + '<p class="note">This device can’t change stock. Sending puts the count in front of Till on the shop '
      + 'computer, where you review it and decide. '
      + (stamps ? stamps + ' location' + (stamps === 1 ? '' : 's') + ' will be set too. ' : '')
      + 'Your numbers stay here until you start a new count.</p></div>';
  }

  function renderReview(){
    var diffs = differences();
    if (!countedProducts().length){
      $('reviewList').innerHTML = '<div class="empty"><b>Nothing counted yet</b>'
        + 'Count some tires first — then you can send them over.</div>';
      return;
    }
    if (!diffs.length){
      $('reviewList').innerHTML = '<div class="empty"><b>Everything matched</b>All '
        + countedProducts().length + ' tires you counted agree with Till.</div>' + sendBlockHtml();
      return;
    }
    var units = 0, value = 0, short = 0, over = 0;
    diffs.forEach(function(p){
      var d = diffOf(p);
      units += d; value += d * (Number(p.buyPrice) || 0);
      if (d < 0) short++; else over++;
    });
    var html = '<div class="summary"><div class="l">Value ' + (value < 0 ? 'short' : 'over') + '</div>'
      + '<div class="v" style="color:' + (value < 0 ? '#fca5a5' : '#86efac') + ';">'
      + (value < 0 ? '-' : '') + '$' + Math.abs(Math.round(value)).toLocaleString() + '</div>'
      + '<div class="split">'
      + '<div><div class="l">Tires short</div><div class="n">' + short + '</div></div>'
      + '<div><div class="l">Tires over</div><div class="n">' + over + '</div></div>'
      + '<div><div class="l">Units</div><div class="n">' + (units > 0 ? '+' : '') + units + '</div></div>'
      + '</div></div>';

    diffs.forEach(function(p){
      var d = diffOf(p), nm = nameLines(p);
      html += '<div class="row" style="display:block;">'
        + '<div class="crow-top"><div style="min-width:0;">'
        + '<div class="name">' + esc(nm.title) + '</div>'
        + '<div class="brandline">' + (nm.brand ? esc(nm.brand) + ' · ' : '') + esc(rackOf(p)) + '</div>'
        + '</div><span class="tag ' + (d > 0 ? 'up' : 'dn') + '">' + (d > 0 ? '+' : '') + d + '</span></div>'
        + '<div class="arrowline"><span class="was">' + onFile(p) + '</span><span class="arr">→</span>'
        + '<span>' + counted[pid(p)] + '</span>'
        + '<span style="margin-left:auto;font-size:12.5px;font-weight:700;color:' + (d < 0 ? 'var(--danger)' : 'var(--good)') + ';">'
        + (d < 0 ? '-' : '') + '$' + Math.abs(Math.round(d * (Number(p.buyPrice) || 0))).toLocaleString() + '</span></div>'
        + '</div>';
    });
    html += sendBlockHtml();
    $('reviewList').innerHTML = html;
  }

  // ---------- sending a count to the computer ----------
  // Every line that was actually counted goes, not just the ones that differ: a
  // rack the computer can see was counted and matched is worth as much as a
  // correction, and it's what lets the computer show "312 counted, 4 different".
  function countPayload(){
    return countedProducts().map(function(p){
      var id = pid(p);
      return {
        id: id,
        counted: counted[id],
        expected: expectedAt[id] !== undefined ? expectedAt[id] : onFile(p),
        location: foundAt[id] || ''
      };
    });
  }
  function defaultCountName(){
    return 'Count · ' + new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }
  function deviceLabel(){
    // Enough to tell the tablet from the phone in the computer's list, without
    // getting clever about device fingerprinting.
    var w = Math.max(screen.width || 0, screen.height || 0);
    return w >= 900 ? 'Tablet' : 'Phone';
  }

  function sendCount(){
    if (sending) return;
    var lines = countPayload();
    if (!lines.length) return;
    sending = true; renderReview();
    authedPost('/rest/v1/stock_counts', {
      name: (countName || '').trim() || defaultCountName(),
      device: deviceLabel(),
      status: 'pending',
      lines: lines
    }).then(function(res){
      sending = false;
      if (!res.ok){
        // 404 means the mailbox table isn't there yet — worth saying plainly,
        // because it's a one-time setup step and not something the counter did.
        countError = res.status === 404
          ? 'The computer isn’t set up to receive counts yet. Your count is safe on this device.'
          : 'Couldn’t send — your count is still here. Check the connection and try again.';
        renderReview();
        return;
      }
      countSent = true; countError = '';
      renderReview();
    }).catch(function(){
      sending = false;
      countError = 'Couldn’t send — your count is still here. Check the connection and try again.';
      renderReview();
    });
  }
  var countSent = false, countError = '';
  window.tsSend = sendCount;
  window.tsNewCount = function(){
    clearCount(); countSent = false; countError = '';
    rackFilter = 'All'; countQuery = '';
    var cq = $('cq'); if (cq){ cq.value = ''; $('countSearchWrap').classList.remove('has'); }
    showCount();
  };

  // ---------- sales log ----------
  // A read-only mirror of the desktop Sales log: the same Day / Week / Month / All
  // grouping, and the same three totals (Units, Sales, Profit). The phone never
  // recomputes profit — it reads the `work` the shop computer already logged, so
  // the numbers here always agree with the desktop to the penny. View only; there
  // is no delete here (that stays on the computer, where the invoice lives).
  var SALES_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var SALES_SEGS = [['day','Day'],['week','Week'],['month','Month'],['all','All']];

  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function round2(n){ return Math.round((Number(n) || 0) * 100) / 100; }
  function signedMoney(n){ var v = Number(n) || 0; return (v < 0 ? '-' : '') + money(Math.abs(v)); }
  function fmtSaleDate(iso){
    // iso is a local YYYY-MM-DD string from the shop — parse the parts by hand so
    // the browser can't shift it a day by reading it as UTC.
    var p = String(iso || '').split('-');
    if (p.length < 3) return String(iso || '');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }
  function salesPeriod(dateStr, mode){
    if (mode === 'all') return { key:'all', label:'All time' };
    if (mode === 'month'){
      var y = dateStr.slice(0,4), m = Number(dateStr.slice(5,7));
      return { key: dateStr.slice(0,7), label: (SALES_MONTHS[m-1] || '') + ' ' + y };
    }
    if (mode === 'week'){
      var p = dateStr.split('-');
      var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      var start = new Date(d); start.setDate(d.getDate() - d.getDay());
      var key = start.getFullYear() + '-' + pad2(start.getMonth() + 1) + '-' + pad2(start.getDate());
      return { key: key, label: 'Week of ' + fmtSaleDate(key) };
    }
    return { key: dateStr, label: fmtSaleDate(dateStr) };
  }
  function saleMatches(e, q){
    return (String(e.size||'') + ' ' + String(e.brand||'')).toLowerCase().indexOf(q) !== -1;
  }

  function setSalesGroup(m){ salesGroupBy = m; renderSales(); }
  window.tsSalesGroup = setSalesGroup;

  function renderSales(){
    $('salesSeg').innerHTML = SALES_SEGS.map(function(s){
      // Escape the quotes so they don't close the double-quoted onclick early —
      // same guard the rack filter uses. Without it the handler never fires and
      // the view is stuck on Day.
      return '<button class="seg' + (salesGroupBy === s[0] ? ' on' : '') + '" '
        + 'onclick="tsSalesGroup(' + JSON.stringify(s[0]).replace(/"/g, '&quot;') + ')">' + s[1] + '</button>';
    }).join('');

    var q = salesQuery.trim().toLowerCase();
    var all = salesLog.slice().sort(function(a,b){
      return String(b.date||'').localeCompare(String(a.date||'')) || (String(a.id) < String(b.id) ? 1 : -1);
    });
    var entries = q ? all.filter(function(e){ return saleMatches(e, q); }) : all;

    // Totals follow what's on screen (so a search narrows the totals too), and
    // follow the True-profit toggle: recorded work, or Sale minus exact cost.
    var units = 0, sales = 0, work = 0;
    entries.forEach(function(e){
      var qty = Number(e.qty) || 0;
      var sale = (Number(e.sellPrice) || 0) * qty;
      units += qty;
      sales += sale;
      work  += salesTrueProfit ? (sale - (Number(e.cost) || 0) * qty) : (Number(e.work) || 0);
    });

    var html = '<div class="kpis">'
      + '<div class="kpi"><div class="l">Units</div><div class="v">' + units + '</div></div>'
      + '<div class="kpi"><div class="l">Sales</div><div class="v">' + money(sales) + '</div></div>'
      + '<div class="kpi"><div class="l">Profit</div><div class="v ' + (work < 0 ? 'neg' : 'pos') + '">' + signedMoney(work) + '</div></div>'
      + '</div>';

    if (!salesLog.length){
      html += '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/></svg>No sales logged yet.<br>Ring up a tire on the shop computer and it shows here.</div>';
      $('salesList').innerHTML = html; return;
    }
    if (!entries.length){
      html += '<div class="empty">No sales for “' + esc(salesQuery.trim()) + '”</div>';
      $('salesList').innerHTML = html; return;
    }

    var mode = salesGroupBy;
    var groups = [], idx = {};
    entries.forEach(function(e){
      var g = salesPeriod(String(e.date||''), mode);
      if (!(g.key in idx)){ idx[g.key] = groups.length; groups.push({ label:g.label, items:[], sales:0 }); }
      var gr = groups[idx[g.key]];
      gr.items.push(e);
      gr.sales += (Number(e.sellPrice) || 0) * (Number(e.qty) || 0);
    });

    groups.forEach(function(g){
      html += '<div class="grouphead">' + esc(g.label) + '<span>' + money(g.sales) + '</span></div>';
      g.items.forEach(function(e){
        var qty = Number(e.qty) || 0, unit = Number(e.sellPrice) || 0, sale = unit * qty;
        // Recorded: COGS is rounded up, so work = e.work and cogs = sale - work.
        // True profit: cost is the exact per-tire cost, unrounded, so the padding
        // the round-up added drops out of both the cost and the profit.
        var w, cogs;
        if (salesTrueProfit) { cogs = round2((Number(e.cost) || 0) * qty); w = round2(sale - cogs); }
        else { w = Number(e.work) || 0; cogs = sale - w; }
        var used = e.condition === 'used';
        var size = String(e.size || '').trim(), brand = String(e.brand || '').trim();
        var title = size || brand || 'Tire';
        var bits = [];
        if (size && brand) bits.push(esc(brand));               // brand only when size already took the title line
        if (mode !== 'day') bits.push(fmtSaleDate(e.date));      // the group header already carries the day in Day mode
        bits.push(qty + ' sold');
        html += '<div class="srow">'
          + '<div class="top"><div style="min-width:0;">'
          + '<div class="name">' + esc(title) + '</div>'
          + '<div class="brandline">' + bits.join(' · ') + '</div>'
          + '</div><div style="text-align:right;flex:0 0 auto;">'
          + '<div class="sell">' + money(sale) + '</div>'
          + '<span class="tag ' + (used ? 'used' : 'new') + '" style="margin-top:5px;display:inline-block;">' + (used ? 'USED' : 'NEW') + '</span>'
          + '</div></div>'
          + '<div class="ftr"><span>' + qty + ' × ' + money(unit) + '</span>'
          + '<span class="cost">cost ' + money(cogs) + '</span>'
          + '<span class="work' + (w < 0 ? ' neg' : '') + '">' + (w < 0 ? '-' : '+') + money(Math.abs(w)) + ' profit</span>'
          + '</div></div>';
      });
    });

    $('salesList').innerHTML = html;
  }

  // ---------- view switches ----------
  var VIEWS = ['login', 'app', 'countView', 'reviewView', 'salesView'];
  function only(id, disp){
    VIEWS.forEach(function(v){ $(v).style.display = (v === id ? (disp || 'flex') : 'none'); });
  }
  function showLogin(msg){
    only('login');
    if (msg){ var m = $('loginMsg'); m.textContent = msg; m.className = 'msg err'; }
  }
  function showApp(){ only('app'); }
  function showSales(){ only('salesView'); renderSales(); }
  function showCount(){ only('countView'); renderCount(); }
  function showReview(){ only('reviewView'); renderReview(); }
  function showLoading(){
    only('app');
    if (!products.length) $('list').innerHTML = '<div class="center"><div class="spin"></div>Loading stock…</div>';
  }

  // ---------- events ----------
  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = $('loginBtn'), msg = $('loginMsg');
    msg.className = 'msg';
    btn.disabled = true; btn.textContent = 'Signing in…';
    login($('email').value.trim(), $('password').value)
      .then(function(d){ saveSession(d, $('remember').checked); return loadStock(); })
      .catch(function(err){
        msg.textContent = (err && err.message) || 'Sign-in failed'; msg.className = 'msg err';
      })
      .then(function(){ btn.disabled = false; btn.textContent = 'Sign in'; });
  });
  $('signOutBtn').addEventListener('click', function(){
    clearSession(); products = []; salesLog = []; $('q').value = ''; query = '';
    $('sq').value = ''; salesQuery = ''; $('salesSearchWrap').classList.remove('has');
    $('searchWrap').classList.remove('has');
    showLogin(); document.getElementById('loginMsg').className = 'msg';
  });
  // Spin once on every press — the tap has to look like it did something, even
  // when the stock comes back identical.
  $('refreshBtn').addEventListener('click', function(){
    var btn = this;
    btn.classList.remove('spinning');
    void btn.offsetWidth;                 // restart the animation on a repeat tap
    btn.classList.add('spinning');
    if (session) loadStock();
  });
  $('refreshBtn').addEventListener('animationend', function(){ this.classList.remove('spinning'); }, true);

  $('salesBtn').addEventListener('click', showSales);
  $('salesBackBtn').addEventListener('click', showApp);
  $('trueProfitBtn').addEventListener('click', function(){
    salesTrueProfit = !salesTrueProfit;
    this.classList.toggle('on', salesTrueProfit);
    this.setAttribute('aria-checked', salesTrueProfit ? 'true' : 'false');
    renderSales();
  });
  $('sq').addEventListener('input', function(){
    salesQuery = this.value;
    $('salesSearchWrap').classList.toggle('has', !!salesQuery);
    renderSales();
  });
  $('sClrBtn').addEventListener('click', function(){
    $('sq').value = ''; salesQuery = '';
    $('salesSearchWrap').classList.remove('has');
    renderSales();
  });

  $('countBtn').addEventListener('click', function(){ if (products.length) showCount(); });
  $('countBackBtn').addEventListener('click', showApp);
  $('reviewBackBtn').addEventListener('click', showCount);
  $('countClearBtn').addEventListener('click', function(){
    if (!Object.keys(counted).length) return;
    if (!confirm('Start this count over? The numbers you\'ve entered are cleared. Nothing in Till changes.')) return;
    clearCount(); countSent = false; countError = ''; renderCount();
  });
  $('cq').addEventListener('input', function(){
    countQuery = this.value;
    $('countSearchWrap').classList.toggle('has', !!countQuery);
    renderCount();
  });
  $('cClrBtn').addEventListener('click', function(){
    $('cq').value = ''; countQuery = '';
    $('countSearchWrap').classList.remove('has');
    renderCount();
  });
  $('q').addEventListener('input', function(){
    query = this.value;
    $('searchWrap').classList.toggle('has', !!query);
    renderList();
  });
  $('clrBtn').addEventListener('click', function(){ $('q').value=''; query=''; $('searchWrap').classList.remove('has'); renderList(); });
  // A tap on a clear button must NOT pull focus off the search input — if it
  // does, the phone keyboard drops and springs back, which reads as a jarring
  // shift. Cancelling the press's default focus-steal keeps the input (and the
  // keyboard) put; the click still fires and clears the text.
  ['clrBtn', 'cClrBtn', 'sClrBtn'].forEach(function(id){
    $(id).addEventListener('mousedown', function(e){ e.preventDefault(); });
  });
  // Coming back to the tab after a while → refresh so stock is current.
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && session && products.length) loadStock();
  });

  // ---------- boot ----------
  if (session && (session.access_token || session.refresh_token)) loadStock();
  else showLogin();
})();
</script>
</body>
</html>
